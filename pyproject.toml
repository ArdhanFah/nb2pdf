[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nb2pdf"
version = "0.1.0"
description = "Convert Jupyter Notebooks to Neobrutalism styled PDFs with custom footer"
readme = "README.md"
authors = [{ name = "ArdhanFah" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "nbconvert",
    "nbformat",
    "weasyprint",
    "click",
    "jinja2",
    "pygments",
    "markdown"
]

[project.scripts]
nb2pdf = "nb2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nb2pdf = ["templates/*"]
